name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native client
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check Swift and iOS
        run: bash ios/scripts/check.sh
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-validation-${{ github.run_attempt }}
          path: target/ios-validation/run.*/ios-*
          if-no-files-found: warn
          retention-days: 7
