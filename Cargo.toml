[package]
name = "agent-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "agent"

[[bin]]
name = "agent"
path = "src/main.rs"

[[bin]]
name = "export-protocol"
path = "src/bin/export_protocol.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
fs2 = "0.4"
libc = "0.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
ts-rs = { version = "11", features = ["serde-compat", "uuid-impl"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
