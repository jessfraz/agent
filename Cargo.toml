[package]
name = "agent-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "agent"

[[bin]]
name = "agent"
path = "src/main.rs"

[[bin]]
name = "export-protocol"
path = "src/bin/export_protocol.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
fs2 = "0.4"
httparse = "1"
libc = "0.2"
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
