[package]
name = "agent-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "agent"

[[bin]]
name = "agent"
path = "src/main.rs"

[[bin]]
name = "export-protocol"
path = "src/bin/export_protocol.rs"

[[example]]
name = "terminal-fixture"
path = "examples/terminal_fixture.rs"
test = true

[[example]]
name = "cli-performance"
path = "examples/cli_performance.rs"
test = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "7"
fs2 = "0.4"
hex = "0.4"
httparse = "1"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
ratatui-textarea = "0.9.3"
rrule = "0.14.0"
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
vt100 = "0.18.1"
